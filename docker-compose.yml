version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hirewise-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hirewise
      POSTGRES_USER: hirewise
      POSTGRES_PASSWORD: hirewise_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirewise -d hirewise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

